[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-drs"
version = "0.1.1"
description = "A PyTorch-inspired, event-driven Discrete Rate Simulation framework."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jonathan Lamontagne Kratz" }]
keywords = [
    "simulation",
    "discrete-rate",
    "drs",
    "discrete-event",
    "modeling",
    "continuous-flow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "seaborn>=0.12",
]

[project.optional-dependencies]
progress = ["rich>=13.0"]
dev = ["build", "twine", "pytest"]

[project.urls]
Homepage = "https://github.com/epicgamer17/python-drs"
Repository = "https://github.com/epicgamer17/python-drs"
Documentation = "https://github.com/epicgamer17/python-drs/tree/main/docs"

[tool.setuptools]
# Explicit package list avoids flat-layout auto-discovery surprises.
packages = ["drs"]