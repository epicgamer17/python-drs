[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-drs"
version = "0.1.1"
description = "PyTorch-inspired, event-driven Discrete Rate Simulation (DRS) framework for fast, exact continuous-flow modeling in Python."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jonathan Lamontagne Kratz" }]
keywords = [
    "simulation",
    "discrete-rate-simulation",
    "drs",
    "discrete-event-simulation",
    "continuous-flow",
    "event-driven",
    "modeling",
    "simulation-framework",
    "python-simulation",
    "system-dynamics",
    "hybrid-simulation",
    "process-simulation",
    "power-systems",
    "scientific-computing",
    "pytorch",
    "engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "seaborn>=0.12",
]

[project.optional-dependencies]
progress = ["rich>=13.0"]
dev = ["build", "twine", "pytest"]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0"
]

[project.urls]
Homepage = "https://github.com/epicgamer17/python-drs"
Repository = "https://github.com/epicgamer17/python-drs"
Documentation = "https://python-drs.readthedocs.io/"

[tool.setuptools]
# Explicit package list avoids flat-layout auto-discovery surprises.
packages = ["drs"]